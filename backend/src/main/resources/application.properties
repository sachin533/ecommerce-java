server.port=8000

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/ecommerce}

elastic.url=${ES_URL:http://localhost:9200}
elastic.index=${ES_INDEX:orders}

admin.username=${ADMIN_USER:admin}
admin.password=${ADMIN_PASSWORD:admin}

cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}

sync.poll-seconds=${SYNC_POLL_SECONDS:15}
sync.lookback-seconds=${SYNC_LOOKBACK_SECONDS:120}
